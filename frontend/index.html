<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DGM Peças - Soluções em Mangueiras e Conexões Hidráulicas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header-banner">
        <div>Soluções em Mangueiras e Conexões Hidráulicas</div>
    </header>

    <div class="container text-center mb-5">
        <div class="d-flex justify-content-center flex-wrap">
            <button class="filter-btn active" onclick="filtrar('Todos', event)">Todos</button>
            <button class="filter-btn" onclick="filtrar('Conexões', event)">Conexões</button>
            <button class="filter-btn" onclick="filtrar('Mangueiras', event)">Mangueiras</button>
            <button class="filter-btn" onclick="filtrar('Ferramentas', event)">Ferramentas</button>
            <button class="filter-btn" onclick="filtrar('Agrícola', event)">Agrícola</button>
        </div>
    </div>

    <div class="container">
        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-success" role="status"></div>
            <p class="mt-2 text-muted">Buscando peças...</p>
        </div>

        <div id="lista-produtos" class="row g-4"></div>
    </div>

    <footer>
        <div class="container">
            <div class="row">
                <div class="col-md-6 text-center text-md-start mb-3 mb-md-0">
                    <h5 class="fw-bold">DGM Peças © 2026 | Posse - GO</h5>
                </div>
                <div class="col-md-6 text-center text-md-end">
                    📍
                    <a href="https://www.google.com/maps?q=Rua+Pitomba,+QD+12+LT+03,+St+Morada+Nova+-+Posse-GO" target="_blank" class="address-link">
                        Rua Pitomba, QD 12 LT 03, St Morada Nova - Posse-GO
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
